[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "skyllh"
dynamic = ["version"]
description = "The SkyLLH framework is an open-source Python3-based package licensed under the GPLv3 license. It provides a modular framework for implementing custom likelihood functions and executing log-likelihood ratio hypothesis tests. The idea is to provide a class structure tied to the mathematical objects of the likelihood functions."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Martin Wolf", email = "martin.wolf@tum.de"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "astropy>=7.0",
    "matplotlib",
    "numpy",
    "pyyaml",
    "scipy<1.18",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/icecube/skyllh"
Documentation = "https://icecube.github.io/skyllh"
Issues = "https://github.com/icecube/skyllh/issues"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest>=9.0.0",
    "ruff>=0.16",
]
docs = [
    "sphinx<9.0.0",
    "shibuya",
    "nbsphinx",
    "ipython",
    "sphinxcontrib-apidoc",
    "sphinx-multiversion",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-iconify",
]
extras = [
    "iminuit",
    "pyarrow",
]

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["skyllh*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["skyllh"]

[tool.ruff.lint.per-file-ignores]
# These module names are part of the public import path and match the
# public dataset release names; renaming would be a breaking change.
"skyllh/datasets/i3/PublicData_10y_ps.py" = ["N999"]
"skyllh/datasets/i3/PublicData_10y_ps_wMC.py" = ["N999"]
"skyllh/datasets/i3/PublicData_14y_ps.py" = ["N999"]
"skyllh/datasets/i3/PublicData_14y_ps_v2.py" = ["N999"]
"skyllh/datasets/i3/TestData.py" = ["N999"]

[tool.ruff.lint.pydocstyle]
convention = "numpy" 

[tool.ruff.format]
quote-style = "single"

[tool.pytest]
minversion = "9.0"
addopts = ["-ra"]
testpaths = ["tests"]
